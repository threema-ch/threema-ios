[package]
name = "libthreema-dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
aead = {
    version = "0.5",
    default-features = false,
    features = [
        "alloc",
        "rand_core",
        "std",
    ]
}
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
blake2 = {
    version = "0.10",
    default-features = false,
    features = [
        "std",
        # "zeroize",
    ]
}
chacha20 = {
    version = "0.9", # 0.10+ held back by chacha20poly1305,
    features = [
        "zeroize",
    ]
}
chacha20poly1305 = {
    version = "0.10",
    default-features = false,
    features = [
        "alloc",
    ]
}
cipher = "0.4" # 0.5+ held back by chacha20
crypto_secretbox = {
    version = "0.1",
    default-features = false,
    features = [
        "alloc",
        "salsa20",
    ]
}
data-encoding = "2"
digest = "0.10" # 0.11+ held back by blake2, curve25519-dalek, hmac, pbkd2, sha1, sha2
ed25519-dalek = "2"
hmac = {
    version = "0.12", # 0.13+ held back by dependencies to digest@0.10
    default-features = false,
}
pbkdf2 = "0.12" # 0.13+ held back by dependencies to digest@0.10
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"] }
# Important: The `log` feature should not be enabled for rand@0.8, see RUSTSEC-2026-0097.
rand = "0.8" # 0.9+ held back by aead and its dependency to API incompatible rand_core version
salsa20 = {
    version = "0.10", # 0.11+ held back by cipher
    default-features = false,
    features = [
        "std",
        "zeroize",
    ]
}
scrypt = {
    version = "0.11", # 0.12+ held back by other dependencies to cipher, digest, hmac, ...
    default-features = false,
}
sha2 = {
    version = "0.10", # 0.11+ held back by other dependencies to cipher, digest, sha2
    default-features = false,
    features = [
        "std",
        # "zeroize",
    ]
}
subtle = { version = "2", features = ["const-generics"] }
x25519-dalek = {
    version = "2",
    features = [
        "reusable_secrets",
        "static_secrets",
        "zeroize",
    ]
}
zeroize = "1"

[features]
seedable-rng = []

[lints]
workspace = true
